apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollabot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ollabot
  template:
    metadata:
      labels:
        app: ollabot
    spec:
      containers:
      - name: ollabot
        image: ollabot:latest-version
        ports:
        - containerPort: 8501
        - containerPort: 8000

---

apiVersion: v1
kind: Service
metadata:
  name: ollabot
spec:
  type: LoadBalancer
  selector:
      app: ollabot
  ports:
  - name: streamlit
    port: 8501
    targetPort: 8501
  - name: fastapi
    port: 8000
    targetPort: 8000
  - name: ollama
    port: 11434
    targetPort: 11434



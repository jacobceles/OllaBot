apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fastapi
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: fastapi
  endpoints:
  - port: fastapi       # ✅ Use the same port name as in the service
    interval: 15s
    path: /metrics
  namespaceSelector:
    matchNames:
    - tartarus
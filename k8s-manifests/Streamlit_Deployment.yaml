apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit
  template:
    metadata:
      labels:
        app: streamlit
    spec:
      initContainers:
        - name: check-fastapi
          image: busybox:latest
          command: [ "bin/sh","-c" ]
          args:
            - |
              until wget --spider -q http://fastapi:8000/ || nc -z fastapi 8000;
              do
                echo "Waiting for FastAPI to be available...";
                sleep 5;
              done;
              echo "FastAPI is up and running!";
      containers:
      - name: streamlit
        image: streamlit:latest-version
        ports:
        - containerPort: 8501
---

apiVersion: v1
kind: Service
metadata:
  name: streamlit
spec:
  type: NodePort
  selector:
      app: streamlit
  ports:
  - name: streamlit
    port: 8501
    targetPort: 8501
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streamlit
  template:
    metadata:
      labels:
        app: streamlit
    spec:
      containers:
      - name: streamlit
        image: ollabot:latest-version
        ports:
        - containerPort: 8501
---

apiVersion: v1
kind: Service
metadata:
  name: streamlit
spec:
  type: LoadBalancer
  selector:
      app: streamlit
  ports:
  - name: streamlit
    port: 8501
    targetPort: 8501
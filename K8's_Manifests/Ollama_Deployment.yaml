apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ollama-service
  template:
    metadata:
      labels:
        app: ollama-service
    spec:
      containers:
      - name: ollama-service
        image: ollabot:latest-version
        ports:
        - containerPort: 11434
---

apiVersion: v1
kind: Service
metadata:
  name: ollama-service
spec:
  type: LoadBalancer
  selector:
      app: ollama-service
  ports:
  - name: ollama
    port: 11434
    targetPort: 11434
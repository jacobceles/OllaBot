apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
      - name: ollabot
        image: ollabot:latest-version
        ports:
        - containerPort: 8000
---

apiVersion: v1
kind: Service
metadata:
  name: fastapi
spec:
  type: LoadBalancer
  selector:
      app: fastapi
  ports:
  - name: fastapi
    port: 8000
    targetPort: 8000